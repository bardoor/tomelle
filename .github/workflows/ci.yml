name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gobo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Gobo Eiffel 26.06
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gobo.tar.xz"
          distribution="$RUNNER_TEMP/gobo-distribution"
          url='https://github.com/gobo-eiffel/gobo/releases/download/gobo-26.06/gobo-linux-x86_64-26.06.30%2Bae3f1ee.tar.xz'
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo 'd7d27a115863ac822024fd6968097c11af515e0eae46147cb053a48a7aa040d8  '"$archive" | sha256sum --check
          mkdir -p "$distribution"
          tar -xJf "$archive" -C "$distribution"
          gec_path=$(find "$distribution" -path '*/bin/gec' -print -quit)
          test -n "$gec_path"
          gobo_directory=$(dirname "$(dirname "$gec_path")")
          echo "GOBO=$gobo_directory" >> "$GITHUB_ENV"
          echo "$gobo_directory/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: getest tests/getest.ge

      - name: Run TOML 1.1 conformance suite
        run: ./scripts/toml-test.sh

  eiffelstudio:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install EiffelStudio 25.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/eiffelstudio.tar.bz2"
          distribution="$RUNNER_TEMP/eiffelstudio-distribution"
          url='https://www.eiffel.com/cdn/EiffelStudio/25.12/98922/Eiffel_25.12_rev_98922-linux-x86-64.tar.bz2'
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo 'db26cd83844582b86293cd3b9a0caf7905e78619765724746dffa86bbdef9a6c  '"$archive" | sha256sum --check
          mkdir -p "$distribution"
          tar -xjf "$archive" -C "$distribution"
          ec_path=$(find "$distribution" -path '*/studio/spec/linux-x86-64/bin/ec' -print -quit)
          test -n "$ec_path"
          eiffel_directory=${ec_path%/studio/spec/linux-x86-64/bin/ec}
          echo "ISE_EIFFEL=$eiffel_directory" >> "$GITHUB_ENV"
          echo 'ISE_PLATFORM=linux-x86-64' >> "$GITHUB_ENV"
          echo "$(dirname "$ec_path")" >> "$GITHUB_PATH"
          export ISE_EIFFEL="$eiffel_directory"
          export ISE_PLATFORM=linux-x86-64
          export PATH="$(dirname "$ec_path"):$PATH"
          ec -version

      - name: Compile and run with EiffelStudio
        run: ./scripts/test-eiffelstudio.sh
